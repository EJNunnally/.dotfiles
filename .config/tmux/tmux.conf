# TODO: make some keybindings for other stuff and maybe kill-session

set -g status-right '' # I don't need the date or the time
set -g window-status-current-style ""
set -g status-style 'fg=cyan bg=default fill=default'
set -g message-style 'fg=yellow bg=default fill=default'
set -g renumber-windows 'on'
set -g base-index 1
set -g bell-action none
set -g mouse on
unbind -n MouseDrag1Pane
unbind -Tcopy-mode MouseDrag1Pane

set -g prefix C-SPACE
unbind C-b
bind C-SPACE send-prefix
bind X kill-session

bind C-R source-file ~/.config/tmux/tmux.conf

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

